name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-build:
    name: Java ${{ matrix.java-version }} Build & Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '17', '21']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile, Test and Package with Maven
        run: mvn -B clean verify

      - name: Run 7-Suite Verification Script
        run: python3 scripts/verify_bouncing.py

      - name: Run Headless CLI Smoke Tests
        run: |
          JAR=target/bounded-ruler-simulator.jar
          java -jar "$JAR" | tee default.txt
          grep -q "Final Position  : 2" default.txt
          java -jar "$JAR" --length 1000 --start 999 --direction -1 --steps 200000000 --benchmark --iterations 3
          java -jar "$JAR" --length 1000000000000 --start 1 --direction -1 --steps 999999999999999 --solver analytical
          java -jar "$JAR" --scenarios scenarios/reference-scenarios.csv
          java -jar "$JAR" --length 12 --start 3 --steps 60 --export-csv output/trajectory.csv
          test "$(wc -l < output/trajectory.csv)" -eq 62

  docker:
    name: Docker Image & Compose Stack
    runs-on: ubuntu-latest
    needs: matrix-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Multi-Stage Image
        run: docker compose build simulator

      - name: Run Simulator, Scenario and Benchmark Services
        run: |
          docker compose run --rm simulator
          docker compose run --rm scenarios
          docker compose run --rm benchmark
